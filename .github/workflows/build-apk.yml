name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Capacitor Android Project
        run: |
          mkdir android-app && cd android-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Access Salud" "com.accesssalud.art" --web-dir ../ml-app-pwa
          npx cap add android
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessSalud-App
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
